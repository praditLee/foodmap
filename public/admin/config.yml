              - {
                  label: "มกราคม",
                  name: "jan",
                  widget: "select",
                  required: false,
                  options:
                    [
                      { label: "🟨 ช่วงเวลาปลูก", value: "planting" },
                      { label: "🟩 ช่วงเวลาเก็บเกี่ยว", value: "harvest" },
                      { label: "🟩 ช่วงที่ผลผลิตออกมากที่สุด", value: "peak" },
